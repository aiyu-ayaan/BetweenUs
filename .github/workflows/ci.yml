name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI-only secrets. Real deployments read these from the environment.
  JWT_SECRET: ci-access-secret-not-used-anywhere-else
  JWT_REFRESH_SECRET: ci-refresh-secret-not-used-anywhere-else
  JWT_ACCESS_TTL: 15m
  JWT_REFRESH_TTL: 90d
  NODE_ENV: test
  LOG_LEVEL: warn

jobs:
  verify:
    name: Lint, typecheck, build, self-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      # Package self-checks: crypto primitives, storage, logger redaction, and
      # AuthService against an in-memory database.
      - run: pnpm check

  integration:
    name: Integration smoke (REST + WebSocket)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: betweenus
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/betweenus?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      LOCAL_STORAGE_PATH: ./storage-data
      LOCAL_STORAGE_PUBLIC_PREFIX: /api/v1/uploads
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @betweenus/database run migrate:deploy
      - run: pnpm build

      - name: Start services
        run: |
          # call-service is here for the presence smoke: the voice roster is
          # published by whoever holds the signalling sockets, so a roster
          # cannot be made without it.
          for service in auth-service server-service chat-service presence-service notification-service call-service remote-gateway; do
            node "apps/services/$service/dist/main.js" > "/tmp/$service.log" 2>&1 &
          done
          for port in 3001 3003 3004 3005 3007 3008; do
            for _ in $(seq 1 30); do
              curl -sf "127.0.0.1:$port/health" > /dev/null && break
              sleep 2
            done
            curl -sf "127.0.0.1:$port/health" || { echo "port $port never came up"; exit 1; }
          done

      - run: node apps/services/chat-service/smoke.mjs
      - run: node apps/services/presence-service/smoke.mjs
      - run: node apps/services/notification-service/smoke.mjs
      - run: node apps/services/remote-gateway/smoke.mjs

      - name: Service logs
        if: failure()
        run: tail -n 200 /tmp/*.log

  android:
    name: Android debug build and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

      # 21 because gradle/gradle-daemon-jvm.properties asks for it, which is
      # the same version the release job builds with.
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      # No google-services.json and no local.properties here on purpose: a
      # pull request has to build the way a fresh clone does. The Firebase
      # plugin is applied only when the file exists, so this is the path a
      # contributor is actually on.
      - run: ./gradlew testDebugUnitTest --stacktrace

      # The debug APK, which is the check that matters: it is the whole
      # manifest, every resource and the Compose compiler, none of which a unit
      # test touches.
      - run: ./gradlew assembleDebug --stacktrace

      # Compiled, not run. The instrumented tests need a device, and an
      # emulator on every pull request is minutes of runner time for a suite
      # that is about the Keystore and SharedPreferences; compiling them is
      # what stops them rotting.
      - run: ./gradlew assembleDebugAndroidTest --stacktrace
