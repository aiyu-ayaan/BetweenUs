# Automated release, driven by a marker at the START of a commit subject on
# master:
#
#   !major   1.4.2         -> 2.0.0           stable
#   !feat    1.4.2         -> 1.5.0           stable
#   !fix     1.4.2         -> 1.4.3           stable
#   !alpha   0.0.1         -> 0.0.2-alpha.1   pre-release
#            0.0.2-alpha.1 -> 0.0.2-alpha.2
#   !beta    0.0.2-alpha.3 -> 0.0.2-beta.1    promote, same base version
#   !stable  0.0.2-beta.2  -> 0.0.2           promote to stable, no bump
#
# A marker may name the platforms the release is for, in the scope position:
#
#   !alpha(android)          builds the Android artifacts and nothing else
#   !fix(android,desktop)    both clients, no server images
#   !feat                    builds everything, which is what no scope means
#
# The names are `docker` (every server image, `web` and `admin-web` among
# them), `desktop` and `android`, plus a few aliases and `all`. A scope that is
# not entirely platform names is a conventional-commit scope and changes
# nothing: `!feat(chat)` builds all three.
#
# A platform left out is not left behind. Its artifacts from the last release
# are carried into this one - the images are re-tagged under the new version,
# the installers and the APKs are re-attached - so `<service>-<version>` exists
# for every service of every version, `latest` never points at a partial set,
# and a GitHub Release always has a full download list. The notes carry a table
# saying which half of that each platform is.
#
# The first release cannot carry anything forward, so a scoped marker with no
# previous tag behind it quietly builds everything instead.
#
# A push with no marker is not a release and this workflow does nothing. The
# rules live in scripts/release-version.mjs and the notes in
# scripts/release-notes.mjs; `pnpm check` runs both self-tests, so a change to
# either fails CI rather than a release.
#
# TWO STEPS, NOT ONE
#
#   1. A marker on master opens (or updates) a release PR. It bumps the version
#      in the manifests and writes the CHANGELOG entry, and nothing is built.
#      The diff is the last chance to look at what is about to ship and at the
#      notes that will describe it.
#
#   2. Merging that PR is what releases. The images go to Docker Hub, the
#      Windows installer and the Android APKs are built, and the tag and the
#      GitHub Release are created last, once all of it exists.
#
# The order in step 2 is the whole rollback story:
#
#   images -> manifest, desktop, android  ->  publish  ->  promote
#
# `images` builds each service twice, amd64 and arm64, on a runner of that
# architecture, and pushes both by digest under no tag at all. `manifest` is
# what names them: one tag per service, a manifest list with both
# architectures in it.
#
# Only exact-version image tags exist while any of it can still fail. The
# moving tags a deployment actually follows - `latest`, `alpha`, `beta` - are
# re-pointed by `promote`, which is dead last: after every artifact is built
# AND after the Release exists. If anything fails, `rollback` deletes the
# version tags it pushed and removes the tag and Release if either got as far
# as existing, and the channel tags have not moved, so they still point at the
# last release that finished.
#
# `promote` used to run before `publish`, and a `publish` that failed left the
# worst of both: `alpha` pointing at a build whose version tags rollback had
# just deleted, and no Release to say what it was.
#
# Nothing here deploys. The Release carries a docker-compose.yml pinned to the
# version, and a server takes it when its operator decides to: a running
# deployment holds the only copy of its data and does not get restarted by a
# git push.

name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      mode:
        description: 'pr = open the release PR; release = build and publish the version master already carries'
        required: true
        default: pr
        type: choice
        options: [pr, release]
      marker:
        description: 'Release type (pr mode only)'
        required: false
        default: alpha
        type: choice
        options: [alpha, beta, stable, fix, feat, major]
      targets:
        description: 'What to build (pr mode only): all, or any of docker/desktop/android, comma-separated'
        required: false
        default: all
        type: string

permissions:
  contents: write
  pull-requests: write

# Never two releases at once: the second would compute its version from a
# manifest the first has already moved past.
concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE_REPO: ${{ vars.BETWEENUS_IMAGE_REPO || 'aiyuayaan/betweenus' }}

jobs:
  # --- Step 1: the release PR ------------------------------------------------

  version:
    name: Work out the next version
    if: github.event_name == 'push' || inputs.mode == 'pr'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.next.outputs.release }}
      marker: ${{ steps.next.outputs.marker }}
      version: ${{ steps.next.outputs.version }}
      current: ${{ steps.current.outputs.version }}
      targets: ${{ steps.targets.outputs.targets }}
      carry: ${{ steps.targets.outputs.carry }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Every subject pushed, not just the head commit: a push of three commits
      # where the middle one asks for a release is still a release.
      - name: Collect pushed commit subjects
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if [ -n "$BEFORE_SHA" ] && [ "$(echo "$BEFORE_SHA" | tr -d 0)" != "" ] \
             && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            git log "$BEFORE_SHA..$AFTER_SHA" --format=%s > subjects.txt
          else
            git log -1 --format=%s > subjects.txt
          fi
          cat subjects.txt

      - name: Use the dispatched marker
        if: github.event_name == 'workflow_dispatch'
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          scope="$(printf '%s' "${TARGETS:-all}" | tr -d ' ')"
          echo "!${{ inputs.marker }}(${scope:-all}): manual release" > subjects.txt
          cat subjects.txt

      - id: current
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Next version
        id: next
        run: |
          node scripts/release-version.mjs \
            --current "${{ steps.current.outputs.version }}" \
            --subjects-file subjects.txt | tee -a "$GITHUB_OUTPUT"

      # What a skipped platform carries its artifacts from: the last release
      # that exists. There is nothing to carry from before the first one, so a
      # scoped marker widens to everything rather than cutting a release with
      # holes in it.
      - name: What to build, and what to carry forward
        id: targets
        if: steps.next.outputs.release == 'true'
        env:
          TARGETS: ${{ steps.next.outputs.targets }}
        run: |
          carry="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          carry="${carry#v}"
          targets="$TARGETS"
          if [ -z "$carry" ] && [ "$targets" != "docker,desktop,android" ]; then
            echo "::notice::No previous release to carry artifacts from; building everything."
            targets="docker,desktop,android"
          fi
          {
            echo "targets=$targets"
            echo "carry=$carry"
          } >> "$GITHUB_OUTPUT"
          echo "building: $targets"
          echo "carrying from: ${carry:-<nothing>}"

      - name: Nothing to release
        if: steps.next.outputs.release != 'true'
        run: echo "No !major/!feat/!fix/!alpha/!beta/!stable marker on this push."

  release-pr:
    name: Release PR for v${{ needs.version.outputs.version }}
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump the manifests
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          node - <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');
          const version = process.env.VERSION;
          // The desktop manifest as well as the root one: electron-builder
          // reads it for the installer name and the About box, so a release
          // whose exe says 0.1.0 is a release nobody can identify.
          for (const path of ['package.json', 'apps/desktop/package.json']) {
            const manifest = JSON.parse(readFileSync(path, 'utf8'));
            manifest.version = version;
            writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
          }
          NODE

      # Everything since the last released tag, which is what this version
      # contains. On the first release there is no tag and the whole history is
      # the answer.
      - name: Write the CHANGELOG entry
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PREVIOUS: ${{ needs.version.outputs.current }}
          TARGETS: ${{ needs.version.outputs.targets }}
          CARRY: ${{ needs.version.outputs.carry }}
        run: |
          if git rev-parse -q --verify "refs/tags/v${PREVIOUS}" > /dev/null; then
            git log "v${PREVIOUS}..HEAD" --format=%s > subjects.txt
          else
            git log --format=%s > subjects.txt
          fi
          node scripts/release-notes.mjs \
            --version "$VERSION" \
            --previous "$PREVIOUS" \
            --repository "$GITHUB_REPOSITORY" \
            --targets "$TARGETS" \
            --carried-from "$CARRY" \
            --subjects-file subjects.txt > CHANGELOG.next.md
          mv CHANGELOG.next.md CHANGELOG.md
          rm -f subjects.txt
          cat CHANGELOG.md

      - name: Open or update the release PR
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: 'chore(release): v${{ needs.version.outputs.version }}'
          title: 'chore(release): v${{ needs.version.outputs.version }}'
          body: |
            Automated release PR — a `!${{ needs.version.outputs.marker }}` marker on master.

            | | |
            | --- | --- |
            | From | `${{ needs.version.outputs.current }}` |
            | To | `${{ needs.version.outputs.version }}` |
            | Marker | `!${{ needs.version.outputs.marker }}` |
            | Builds | `${{ needs.version.outputs.targets }}` |
            | Carries the rest from | `${{ needs.version.outputs.carry || 'nothing - first release' }}` |

            Anything not in **Builds** keeps the artifacts of the release named
            above: its images are re-tagged under this version and its
            installers and APKs are re-attached, so this release is still a
            complete set. The CHANGELOG table below says the same thing to
            whoever reads the release.

            Changed here: `package.json`, `apps/desktop/package.json`,
            `CHANGELOG.md`, `.github/release-targets`.
            The CHANGELOG diff is the release note — edit it in this branch if it
            reads badly, that is what this PR is for.

            **Merging this PR is what releases.** It builds and pushes the server
            images, the Windows installer and the Android APKs, then creates the
            tag and the GitHub Release. Closing it without merging releases
            nothing and costs nothing.
          branch: chore/release-v${{ needs.version.outputs.version }}
          base: master
          labels: release
          delete-branch: true

      - name: Ensure the PR exists
        if: steps.pr.outputs.pull-request-number == ''
        run: |
          echo "No release PR was created or updated."
          echo "Branch protection, or a v${{ needs.version.outputs.version }} that already exists."
          exit 1

      - name: Summary
        run: |
          echo "### Release PR for v${{ needs.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.pr.outputs.pull-request-url }}" >> "$GITHUB_STEP_SUMMARY"

  # --- Step 2: merging that PR is the release --------------------------------

  merged:
    name: Detect a merged release PR
    if: github.event_name == 'push' || inputs.mode == 'release'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.detect.outputs.release }}
      version: ${{ steps.detect.outputs.version }}
      channel: ${{ steps.detect.outputs.channel }}
      prerelease: ${{ steps.detect.outputs.prerelease }}
      targets: ${{ steps.detect.outputs.targets }}
      carry: ${{ steps.detect.outputs.carry }}
    steps:
      # The whole history: HEAD^ is what the version is compared against - on a
      # merge commit that is master as it stood before the PR went in - and the
      # tags are what a carried-forward artifact is taken from.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Is this the release commit
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          subject="$(printf '%s' "$SUBJECT" | head -1)"
          current="$(node -p "require('./package.json').version")"
          release=false

          if [ "$EVENT" = workflow_dispatch ]; then
            # Asked for by hand: release whatever master carries. This is the
            # way back after a rollback, and after a release PR that merged
            # without this job noticing.
            release=true
            echo "Dispatched: releasing v${current} as master stands."
          else
            # A squash or rebase merge puts the PR title on the commit, so the
            # subject answers on its own.
            case "$subject" in
              'chore(release): v'*) release=true ;;
            esac

            # A merge commit's subject is "Merge pull request #n", which says
            # nothing, so the version field is the answer instead: HEAD^ is
            # master before the merge whichever way the PR went in, and only a
            # release PR moves that field.
            #
            # This used to ask which files the commit touched. It could never
            # fire on the one shape it existed for: `git show --name-only`
            # prints NOTHING for a merge commit, so the CHANGELOG.md test was
            # always false and a merged release PR built nothing.
            previous="$(git show HEAD^:package.json 2>/dev/null \
              | node -pe 'JSON.parse(require("node:fs").readFileSync(0,"utf8")).version' \
              2>/dev/null || true)"
            echo "subject: ${subject}"
            echo "version: ${previous:-<unknown>} -> ${current}"
            if [ -n "$previous" ] && [ "$previous" != "$current" ]; then
              release=true
            fi
          fi

          echo "release=$release" >> "$GITHUB_OUTPUT"
          if [ "$release" != true ]; then
            echo "Not a release commit; nothing is built."
            exit 0
          fi

          case "$current" in
            *-alpha.*) channel=alpha ;;
            *-beta.*)  channel=beta ;;
            *)         channel=latest ;;
          esac
          # What the release PR wrote down. Absent - a release cut before this
          # file existed, or a hand-made bump - means everything, which is what
          # every release did until then.
          targets="$(head -1 .github/release-targets 2>/dev/null | tr -d '[:space:]')"
          [ -n "$targets" ] || targets=docker,desktop,android

          # The last release that exists, which is where a platform this one
          # skips takes its artifacts from. HEAD is not tagged yet.
          carry="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          carry="${carry#v}"
          if [ -z "$carry" ] && [ "$targets" != docker,desktop,android ]; then
            echo "::notice::No previous release to carry from; building everything."
            targets=docker,desktop,android
          fi

          {
            echo "version=$current"
            echo "channel=$channel"
            echo "prerelease=$([ "$channel" = latest ] && echo false || echo true)"
            echo "targets=$targets"
            echo "carry=$carry"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing v$current on the $channel channel."
          echo "Building: $targets; carrying the rest from ${carry:-<nothing>}."

  # amd64 and arm64, one runner each, both native. QEMU was the other option
  # and it is the wrong one here: every image runs `pnpm install` and `tsc`
  # over the whole workspace, and emulating that turns a five-minute job into
  # an hour of instruction translation. GitHub's arm64 runners are free for
  # public repositories, so the arm64 half builds on real arm64 hardware.
  #
  # Neither half tags anything. Each pushes its image *by digest* and reports
  # that digest; `manifest` below is what puts a tag on Docker Hub, one tag
  # naming both. Tagging here instead would need an `-amd64`/`-arm64` suffix
  # per image - 27 tags a release, 18 of them scaffolding.
  images:
    name: ${{ matrix.target }} image (${{ matrix.arch }})
    needs: merged
    if: needs.merged.outputs.release == 'true' && contains(needs.merged.outputs.targets, 'docker')
    runs-on: ${{ matrix.runner }}
    strategy:
      # One failure should not hide the rest; every image is independent.
      fail-fast: false
      matrix:
        target:
          - auth-service
          - server-service
          - chat-service
          - presence-service
          - notification-service
          - call-service
          - remote-gateway
          - web
          - admin-web
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The exact version only, and not even that until `manifest` runs. The
      # channel tags a deployment actually follows are moved in `promote`, once
      # every artifact exists - pushing them here would mean a failed Android
      # build leaving `latest` pointing at a release nobody finished.
      - uses: docker/build-push-action@v6
        id: build
        env:
          # Eighteen builds means eighteen build-record artifacts nobody reads,
          # and they are downloaded by anything that asks for "all artifacts".
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          # One Dockerfile builds every image from the repo root: it needs the
          # workspace, the lockfile and packages/, not just one directory.
          context: .
          file: infrastructure/docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          # Pushed with no tag at all: the blobs and a manifest land in the
          # repository addressable only by digest, and stay off the tag page
          # until `manifest` names them.
          outputs: type=image,name=${{ env.IMAGE_REPO }},push-by-digest=true,name-canonical=true,push=true
          # One scope per architecture, not one per target: the nine images
          # share the install and compile stages, so a per-target scope would
          # cache the same layers nine times and hit none of them. The two
          # architectures cannot share a scope, because none of those layers
          # are the same.
          cache-from: type=gha,scope=betweenus-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=betweenus-${{ matrix.arch }}

      # An empty file named after the digest. `manifest` needs nothing else,
      # and a file name travels through the artifact API without quoting.
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$DIGEST"
          mkdir -p "/tmp/digests/${{ matrix.target }}"
          touch "/tmp/digests/${{ matrix.target }}/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.target }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # The tag every job below refers to is created here, and it is a manifest
  # list: one name, two architectures, and a client that pulls it gets the one
  # it can run. Without it an arm64 host - a Pi, an Ampere VPS, an Apple
  # silicon Mac with no Rosetta - fails the pull outright:
  #
  #   no matching manifest for linux/arm64/v8 in the manifest list entries
  #
  # It also runs when nothing was built, because a release that skips `docker`
  # still has to have `<service>-<version>` for every service: `promote` points
  # the channel tags at that name and the deployment bundle pins it. In that
  # case the tag is put on the images of the release being carried forward -
  # the same manifest list under a second name, no rebuild and no pull.
  manifest:
    name: Image tags for v${{ needs.merged.outputs.version }}
    needs: [merged, images]
    # `images` is skipped, not failed, when this release is not for docker, and
    # a skipped need would otherwise take this job with it.
    if: >-
      !cancelled() && needs.merged.outputs.release == 'true'
      && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # merge-multiple keeps the per-target directory each job uploaded, so
      # what lands is digests/<target>/<digest>: two files per target.
      - uses: actions/download-artifact@v4
        if: needs.images.result == 'success'
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true

      - name: Name both architectures with one tag
        if: needs.images.result == 'success'
        env:
          VERSION: ${{ needs.merged.outputs.version }}
        run: |
          for target in auth-service server-service chat-service presence-service \
                        notification-service call-service remote-gateway web admin-web; do
            refs=""
            for digest in "digests/${target}"/*; do
              [ -e "$digest" ] || continue
              refs="$refs ${IMAGE_REPO}@sha256:$(basename "$digest")"
            done

            # Both halves or neither. A manifest list with one architecture in
            # it is the exact bug this job exists to prevent, and it looks like
            # a working release from every amd64 machine anyone would test from.
            count="$(echo $refs | wc -w)"
            if [ "$count" != 2 ]; then
              echo "::error::${target}: expected 2 digests, found ${count}"
              exit 1
            fi

            docker buildx imagetools create \
              --tag "${IMAGE_REPO}:${target}-${VERSION}" $refs
            docker buildx imagetools inspect "${IMAGE_REPO}:${target}-${VERSION}" \
              | grep -E '^(Name|  Platform):' || true
          done

      # No images were built for this release, so this version's tags are a
      # second name for the ones the last release built. `imagetools create`
      # from an existing tag copies the manifest list whole, both architectures
      # with it, and pulls nothing.
      - name: Carry the last release's images into this version
        if: needs.images.result != 'success'
        env:
          VERSION: ${{ needs.merged.outputs.version }}
          CARRY: ${{ needs.merged.outputs.carry }}
        run: |
          if [ -z "$CARRY" ]; then
            echo "::error::Nothing to carry the images forward from."
            exit 1
          fi
          for target in auth-service server-service chat-service presence-service \
                        notification-service call-service remote-gateway web admin-web; do
            docker buildx imagetools create \
              --tag "${IMAGE_REPO}:${target}-${VERSION}" \
              "${IMAGE_REPO}:${target}-${CARRY}"
          done
          echo "Images for v${VERSION} are v${CARRY}'s, re-tagged."

  desktop:
    name: Windows installer and portable exe
    needs: merged
    if: needs.merged.outputs.release == 'true' && contains(needs.merged.outputs.targets, 'desktop')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The whole workspace, because the renderer imports the shared packages
      # and resolves them through their built declarations.
      - run: pnpm build

      - name: Package
        env:
          # No code-signing certificate here. electron-builder would otherwise
          # go looking for one in the machine store and fail on what it finds.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm --filter @betweenus/desktop exec electron-builder --config electron-builder.yml --win

      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: apps/desktop/release/*.exe
          if-no-files-found: error

  android:
    name: Android APKs and AAB
    needs: merged
    if: needs.merged.outputs.release == 'true' && contains(needs.merged.outputs.targets, 'android')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    # Hoisted so the steps below can ask whether they were supplied: the
    # `secrets` context is not available in a step-level `if`, but `env` is.
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
      LOCAL_PROPERTIES: ${{ secrets.ANDROID_LOCAL_PROPERTIES }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      # 21 because gradle/gradle-daemon-jvm.properties asks for it.
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      # google-services.json is gitignored - it names somebody's Firebase
      # project, and which project a build pushes from is the operator's
      # decision. Without the secret the build still succeeds: the Gradle
      # plugin is applied only when the file is there, HAS_FIREBASE goes false,
      # and the app simply never registers for push.
      - name: Firebase client config
        if: env.GOOGLE_SERVICES_JSON != ''
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      # local.properties carries betweenus.serverUrl - the deployment a release
      # build points at by default. It is only a default: the server picker on
      # the login screen overrides it. sdk.dir is not needed, the runner sets
      # ANDROID_HOME.
      - name: Local properties
        if: env.LOCAL_PROPERTIES != ''
        run: printf '%s\n' "$LOCAL_PROPERTIES" > local.properties

      # Unsigned when the secret is absent, which keeps a fork's release
      # runnable without handing it a signing key.
      - name: Keystore
        id: keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # Six ways a perfectly good keystore arrives as something `base64 -d`
          # refuses - PEM banners, line wrapping, a BOM, quotes, the URL-safe
          # alphabet, missing padding - and all six are recovered from. What is
          # left is a secret that does not hold base64 of a keystore, which the
          # script says in those words. Its own self-check covers every shape.
          sh "$GITHUB_WORKSPACE/.github/scripts/decode-keystore.sh" "$RUNNER_TEMP/release.jks"

          # A keystore that cannot be opened with the password and alias it was
          # given is worth finding out about here rather than ten minutes later,
          # as an APK that built fine and is not signed.
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" \
                 -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::The keystore decoded, but ANDROID_KEYSTORE_PASSWORD or ANDROID_KEY_ALIAS does not open it."
            keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" 2>&1 \
              | sed -n '1,20p' || true
            exit 1
          fi

          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      # assembleRelease and bundleRelease are two invocations on purpose:
      # app/build.gradle.kts disables ABI splits whenever a `bundle` task is in
      # the requested set, because AGP refuses splits during a bundle. Ask for
      # both at once and the APKs come out as one universal build with the
      # per-ABI ones missing.
      - name: Build APKs
        env:
          BETWEENUS_VERSION_NAME: ${{ needs.merged.outputs.version }}
          BETWEENUS_VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Build AAB
        env:
          BETWEENUS_VERSION_NAME: ${{ needs.merged.outputs.version }}
          BETWEENUS_VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --stacktrace

      # app-arm64-v8a-release.apk says nothing about which release it is once
      # it has been downloaded. Name them after the version.
      - name: Name the artifacts after the version
        env:
          VERSION: ${{ needs.merged.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/android"
          for apk in app/build/outputs/apk/release/*.apk; do
            abi="$(basename "$apk" | sed -e 's/^app-//' -e 's/-release\.apk$//')"
            cp "$apk" "$RUNNER_TEMP/android/BetweenUs-${VERSION}-${abi}.apk"
          done
          cp app/build/outputs/bundle/release/app-release.aab \
             "$RUNNER_TEMP/android/BetweenUs-${VERSION}.aab"
          ls -la "$RUNNER_TEMP/android"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ${{ runner.temp }}/android/*
          if-no-files-found: error

  # Dead last, after the Release exists. This used to run before `publish`, and
  # a `publish` that failed then left the worst of both: `alpha` pointing at a
  # build whose version tags rollback had just deleted, and no Release to say
  # what it was. The tag a deployment follows is the last thing that moves.
  promote:
    name: Point ${{ needs.merged.outputs.channel }} and latest at this release
    needs: [merged, images, manifest, desktop, android, publish]
    # A platform this release skipped leaves its job skipped rather than
    # failed, and the tags still move: `manifest` has made sure every service
    # has a tag for this version whether it was rebuilt or carried forward.
    if: >-
      !cancelled() && needs.merged.outputs.release == 'true'
      && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # `imagetools create` re-points a tag at an existing manifest. No rebuild,
      # no pull, and it keeps multi-arch manifests intact.
      #
      # Two moving tags, not one. The channel tag says "the newest alpha" or
      # "the newest beta"; `latest` is what docker-compose.yml falls back to
      # when BETWEENUS_VERSION is empty, which is what every first deployment
      # has. It used to be pushed only when the release was stable, so a
      # repository that had never cut one had no `latest` at all, and a plain
      # `up -d` died on a tag that did not exist.
      #
      # `latest` therefore follows the newest release of any channel. Once
      # there is a stable line with alphas still shipping beside it, drop the
      # second tag here, or a deployment tracking `latest` gets walked onto a
      # pre-release by the next alpha.
      - name: Re-point the channel tags
        env:
          VERSION: ${{ needs.merged.outputs.version }}
          CHANNEL: ${{ needs.merged.outputs.channel }}
        run: |
          tags="$CHANNEL"
          [ "$CHANNEL" = latest ] || tags="$tags latest"

          for target in auth-service server-service chat-service presence-service \
                        notification-service call-service remote-gateway web admin-web; do
            for tag in $tags; do
              docker buildx imagetools create \
                --tag "${IMAGE_REPO}:${target}-${tag}" \
                "${IMAGE_REPO}:${target}-${VERSION}"
            done
          done

  publish:
    name: Publish v${{ needs.merged.outputs.version }}
    needs: [merged, images, manifest, desktop, android]
    if: >-
      !cancelled() && needs.merged.outputs.release == 'true'
      && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # By name, both of them. Downloading everything also pulls the nine
      # `*.dockerbuild` build records that build-push-action uploads per image -
      # nothing here wants them, and one of them failing its fifth retry is
      # what took a release down after every artifact had already been built.
      - uses: actions/download-artifact@v4
        if: needs.desktop.result == 'success'
        with:
          name: desktop
          path: artifacts/desktop

      - uses: actions/download-artifact@v4
        if: needs.android.result == 'success'
        with:
          name: android
          path: artifacts/android

      # A platform this release did not build still ships: its artifacts are
      # the ones attached to the release being carried forward, downloaded and
      # attached again under their own names. The names keep the version they
      # were built for, which is the honest answer to "which build is this" -
      # the table in the notes says the same thing in words.
      #
      # It carries transitively without trying to: if v0.0.6 carried the APKs
      # from v0.0.5, they are attached to v0.0.6 like any other asset, and this
      # takes them from there.
      - name: Carry the last release's artifacts forward
        if: needs.desktop.result != 'success' || needs.android.result != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARRY: ${{ needs.merged.outputs.carry }}
          DESKTOP: ${{ needs.desktop.result }}
          ANDROID: ${{ needs.android.result }}
        run: |
          if [ -z "$CARRY" ]; then
            echo "::error::Nothing to carry the artifacts forward from."
            exit 1
          fi
          if [ "$DESKTOP" != success ]; then
            mkdir -p artifacts/desktop
            gh release download "v${CARRY}" --repo "$GITHUB_REPOSITORY"               --pattern '*.exe' --dir artifacts/desktop
          fi
          if [ "$ANDROID" != success ]; then
            mkdir -p artifacts/android
            gh release download "v${CARRY}" --repo "$GITHUB_REPOSITORY"               --pattern '*.apk' --pattern '*.aab' --dir artifacts/android
          fi
          ls -la artifacts/desktop artifacts/android

      # A drop-in deployment folder: compose pinned to this exact version, plus
      # the two files it mounts. The paths are flattened because the release
      # copy sits in a directory of its own rather than in the repo tree.
      - name: Assemble the deployment bundle
        env:
          VERSION: ${{ needs.merged.outputs.version }}
        run: |
          mkdir -p bundle
          sed -e "s|\.\./nginx/nginx\.conf|./nginx.conf|" \
              -e "s|\${BETWEENUS_VERSION:-latest}|\${BETWEENUS_VERSION:-${VERSION}}|g" \
              infrastructure/docker/docker-compose.yml > bundle/docker-compose.yml
          cp infrastructure/docker/backup.sh bundle/backup.sh
          cp infrastructure/nginx/nginx.conf bundle/nginx.conf
          grep -n 'image:' bundle/docker-compose.yml

      # The notes were written and reviewed in the release PR. Reading them back
      # out of CHANGELOG.md means the Release says exactly what the diff said it
      # would, including any edit made on the PR branch.
      - name: Release notes
        id: notes
        env:
          VERSION: ${{ needs.merged.outputs.version }}
        run: |
          {
            echo 'body<<CHANGELOG_EOF'
            node scripts/release-notes.mjs --section --version "$VERSION"
            echo CHANGELOG_EOF
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.merged.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.merged.outputs.version }}
          prerelease: ${{ needs.merged.outputs.prerelease == 'true' }}
          body: |
            ${{ steps.notes.outputs.body }}

            ## Install

            Not every release rebuilds every platform. The **Artifacts** table
            above says which of these were built here and which are the last
            release's, re-attached unchanged - a download whose file name
            carries an older version is that, and it is the current build for
            its platform.

            **Desktop (Windows)** — `BetweenUs-${{ needs.merged.outputs.version }}-Setup.exe`
            installs; `-Portable.exe` needs nothing.

            **Android** — take the APK matching your device (`arm64-v8a` unless it is
            old or an emulator), or `universal` if you would rather not choose. The
            `.aab` is for Play, not for sideloading.

            **Server** — `docker-compose.yml`, `nginx.conf` and `backup.sh` below are a
            deployment folder. Put them beside your existing `.env` and:

            ```bash
            docker compose --env-file .env pull
            docker compose --env-file .env up -d
            ```

            Same project name, same volumes, same `.env` as a built deployment, so an
            existing server keeps its database and its uploads. `BETWEENUS_VERSION` in
            `.env` overrides the pinned version; unset, this bundle stays on
            `${{ needs.merged.outputs.version }}`.

            ## Images

            `${{ env.IMAGE_REPO }}:<service>-${{ needs.merged.outputs.version }}`, built for
            `linux/amd64` and `linux/arm64` under one tag - a 64-bit Pi, an Ampere VPS or an
            Apple silicon Mac pulls the same name and gets its own architecture. The moving
            tags `<service>-${{ needs.merged.outputs.channel }}` and `<service>-latest` are
            pointed at it as the last step of the run.
          files: |
            artifacts/desktop/*
            artifacts/android/*
            bundle/docker-compose.yml
            bundle/nginx.conf
            bundle/backup.sh

  # --- If any of that failed, leave nothing half-published -------------------

  rollback:
    name: Undo a failed release
    needs: [merged, images, manifest, desktop, android, promote, publish]
    if: always() && needs.merged.outputs.release == 'true' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      # Docker Hub has no API in the CLI for deleting a tag, so this is the REST
      # one. The same token that pushed can delete.
      - name: Delete the version image tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VERSION: ${{ needs.merged.outputs.version }}
        run: |
          jwt="$(curl -sf -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg u "$DOCKERHUB_USERNAME" --arg p "$DOCKERHUB_TOKEN" \
                   '{username:$u,password:$p}')" \
            https://hub.docker.com/v2/users/login/ | jq -r .token)"
          if [ -z "$jwt" ] || [ "$jwt" = null ]; then
            echo "::warning::Could not sign in to Docker Hub; version tags left in place."
            exit 0
          fi

          for target in auth-service server-service chat-service presence-service \
                        notification-service call-service remote-gateway web admin-web; do
            tag="${target}-${VERSION}"
            code="$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: JWT $jwt" \
              "https://hub.docker.com/v2/repositories/${IMAGE_REPO}/tags/${tag}/")"
            # 404 is the wanted state too: that image never got pushed.
            case "$code" in
              20*|404) echo "removed ${tag} (${code})" ;;
              *) echo "::warning::could not remove ${tag} (${code})" ;;
            esac
          done

          # The channel tags are deliberately not touched. They still point at
          # the last release that finished, which is the whole reason `promote`
          # runs after everything rather than alongside it.

      # A tag and a Release only exist if `publish` got part way, which is rare
      # but leaves the worst mess: a version people can see and download that
      # has no images behind it.
      - name: Delete the tag and the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.merged.outputs.version }}
        run: |
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release delete "v${VERSION}" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            echo "deleted release v${VERSION} and its tag"
          else
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/v${VERSION}" 2>/dev/null \
              && echo "deleted tag v${VERSION}" \
              || echo "no tag v${VERSION} to delete"
          fi

      - name: Say what is left to do
        env:
          VERSION: ${{ needs.merged.outputs.version }}
        run: |
          {
            echo "### Release v${VERSION} rolled back"
            echo
            echo "Version image tags removed; the \`${{ needs.merged.outputs.channel }}\` tags"
            echo "still point at the last release that finished, and no Release was left behind."
            echo
            echo "The version bump is still on master. Fix what failed and push another"
            echo "marker - the next release will be computed from v${VERSION}, so use"
            echo "\`!fix\` or \`!alpha\` rather than trying to re-cut this one."
          } >> "$GITHUB_STEP_SUMMARY"
