# Builds and pushes one image per service to GitHub Container Registry.
#
# Not part of the pull-request pipeline: ci.yml is what gates a merge. This runs
# on a tag, or by hand, so a deployment can be pinned to something that was
# built once rather than rebuilt on the box it runs on.
name: Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      # One failure should not hide the rest; every image is independent.
      fail-fast: false
      matrix:
        service:
          - auth-service
          - server-service
          - chat-service
          - presence-service
          - notification-service
          - call-service
          - remote-gateway

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          # One Dockerfile builds every image from the repo root: it needs the
          # workspace, the lockfile and packages/, not just one directory.
          context: .
          file: infrastructure/docker/Dockerfile
          target: ${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # One scope for every image, not one per service: they share the
          # install and compile stages, so a per-service scope would cache the
          # same layers seven times and hit none of them.
          cache-from: type=gha,scope=betweenus
          cache-to: type=gha,mode=max,scope=betweenus

  # The two browser bundles: static files behind the same gateway as the
  # services, so they are built the same way and pushed alongside them. `web`
  # was missing here while the compose file built it, which is how it reached a
  # tag with a build that had never run.
  static:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        image:
          - admin-web
          - web

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile
          target: ${{ matrix.image }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=betweenus
          cache-to: type=gha,mode=max,scope=betweenus
