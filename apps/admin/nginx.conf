# Serves the built panel under /admin, which is the path the gateway proxies
# and the base the bundle's asset URLs are built against.
server {
    listen 80;

    location /admin {
        root /usr/share/nginx/html;
        # A single-page app: unknown paths under /admin are its own routes.
        try_files $uri $uri/ /admin/index.html;
    }
}
