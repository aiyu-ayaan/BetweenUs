<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <!--
      Renderer loads no remote code; CSP blocks anything that tries. That is the
      part that matters: script-src stays 'self', so nothing this window fetches
      can become code.

      connect-src and img-src cannot name hosts any more. The deployment is
      chosen at runtime on the login screen, the LiveKit address arrives inside
      a call token, and both are whatever the operator of that deployment says -
      an allowlist compiled into the app could only ever be wrong. What the
      window may *talk to* is therefore open; what it may *run* is not.

      worker-src allows blob: because LiveKit runs end-to-end encryption in a
      worker it creates itself.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; media-src 'self' blob:; connect-src 'self' http: https: ws: wss:"
    />
    <title>Nexora</title>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
