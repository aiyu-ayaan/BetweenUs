<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      Renderer loads no remote code; CSP blocks anything that tries. That is the
      part that matters: script-src stays 'self', so nothing this window fetches
      can become code.

      connect-src and img-src cannot name hosts any more. The deployment is
      chosen at runtime on the login screen and is whatever the operator of that
      deployment says - an allowlist compiled into the app could only ever be
      wrong. What the window may *talk to* is therefore open; what it may *run*
      is not.

      None of this governs media. A peer connection is not a fetch and CSP has
      no say over it, which is as well: the addresses it reaches are the other
      participants', discovered at the time and nameable in advance by nobody.

      frame-src names YouTube, and only YouTube, for Listen Together - and only
      the web client ever uses it. The desktop app plays real youtube.com in a
      view the main process owns, which is not a frame and is not governed here;
      a browser tab cannot do that, because youtube.com refuses to be framed, so
      the web client keeps the /embed/ player. See services/youtube.ts.

      It used to also allow http://127.0.0.1:* - a loopback page the main
      process served, so that a `file://` document had something with a real
      origin to frame the embed from. That whole arrangement is gone with the
      embed it existed for, and so is the permission: leaving it would let any
      page on this machine be framed by this window, for nothing.

      script-src is deliberately not part of this. The usual way to embed a
      player is to load YouTube's iframe_api.js, which is remote code running in
      *this* window. Instead the embed is driven over the postMessage protocol
      that script is a wrapper around, so YouTube's code runs in YouTube's own
      origin, in a cross-origin frame that cannot read this document and which
      this document cannot read.

      script-src allows blob: for the microphone gate, which is an AudioWorklet
      compiled from a string - see services/mic-gate.ts. It has to be script-src
      and not worker-src: CSP puts worklets under script-src, and worker-src
      governs Worker/SharedWorker/ServiceWorker only. With blob: named on the
      wrong directive the gate's module was refused, so the gate never ran - no
      sensitivity, no push-to-talk silence, and no local speaking indicator,
      because the level the ring is drawn from is measured inside it.

      script-src also allows 'wasm-unsafe-eval' for WebAssembly compilation.
      script-src remains 'self' blob: - no external CDN code is permitted.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval'; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://youtube.com https://youtube-nocookie.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; media-src 'self' blob:; connect-src 'self' http: https: ws: wss:"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>BetweenUs</title>
  </head>
  <body class="h-full">
    <!--
      The first paint, before a single byte of the bundle has been parsed.

      `LoadingScreen` cannot cover this gap: it is React, and React is the thing
      being waited for. So the same mark is drawn here in plain markup with no
      script behind it, and `createRoot().render()` replaces it with the real
      component on mount - which is why this lives inside `#root` rather than
      beside it, and why nothing has to remove it.

      Hand-inlined on purpose. A stylesheet would be a second request in front
      of the paint this exists to bring forward - and so is an <img>, which is
      why the mark itself is inline too, written between the brand:mark markers
      by design/brand/build.py. The two colour values are
      the dark theme's `--color-ground` and `--color-accent` from `index.css`,
      which is the one duplication here worth having: a splash that reads the
      theme cannot draw until the theme has loaded.
    -->
    <div id="root" class="h-full">
      <style>
        #boot {
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          background: rgb(6 7 10);
        }
        #boot .mark {
          width: 4.5rem;
          height: 4.5rem;
          fill: rgb(124 92 255);
          overflow: visible;
        }
        /* The two faces slide in from either side and lean in, then keep
           leaning in by turns - a conversation - for as long as this stays up.
           That motion is the whole progress indicator; there is no spinner.
           Lengths on an SVG path are viewBox units: 36 is 36/256 of the mark. */
        #boot .l {
          animation:
            boot-in-l 680ms cubic-bezier(0.2, 0.8, 0.2, 1) both,
            boot-talk-l 2.4s ease-in-out 900ms infinite;
        }
        #boot .r {
          animation:
            boot-in-r 680ms cubic-bezier(0.2, 0.8, 0.2, 1) 80ms both,
            boot-talk-r 2.4s ease-in-out 900ms infinite;
        }
        @keyframes boot-in-l {
          from {
            transform: translateX(-36px);
            opacity: 0;
          }
          70% {
            transform: translateX(2px);
            opacity: 1;
          }
        }
        @keyframes boot-in-r {
          from {
            transform: translateX(36px);
            opacity: 0;
          }
          70% {
            transform: translateX(-2px);
            opacity: 1;
          }
        }
        @keyframes boot-talk-l {
          25% {
            transform: translateX(4px);
          }
          50%,
          100% {
            transform: none;
          }
        }
        @keyframes boot-talk-r {
          0%,
          50% {
            transform: none;
          }
          75% {
            transform: translateX(-4px);
          }
        }
        @media (prefers-reduced-motion: reduce) {
          #boot .l,
          #boot .r {
            animation: none;
          }
        }
      </style>
      <div id="boot">
        <!-- brand:mark --><svg class="mark" viewBox="0 0 256 256" aria-hidden="true"><path class="l" d="M106 26.35C106.17 31.63 106.5 48.39 107 58C107.5 67.61 106.67 76.33 109 84C111.33 91.67 118.83 99.5 121 104C123.17 108.5 123.67 107.83 122 111C120.33 114.17 111.83 118.5 111 123C110.17 127.5 116.83 133.67 117 138C117.17 142.33 112 145.33 112 149C112 152.67 116.5 156.17 117 160C117.5 163.83 117.17 165.67 115 172C112.83 178.33 106.83 188.74 104 198C101.17 207.26 99 222.65 98 227.58A104 104 0 0 1 106 26.35Z"/><path class="r" d="M150 26.35C149.83 31.63 149.5 48.39 149 58C148.5 67.61 149.33 76.33 147 84C144.67 91.67 137.17 99.5 135 104C132.83 108.5 132.33 107.83 134 111C135.67 114.17 144.17 118.5 145 123C145.83 127.5 139.17 133.67 139 138C138.83 142.33 144 145.33 144 149C144 152.67 139.5 156.17 139 160C138.5 163.83 138.83 165.67 141 172C143.17 178.33 149.17 188.74 152 198C154.83 207.26 157 222.65 158 227.58A104 104 0 0 0 150 26.35Z"/></svg><!-- /brand:mark -->
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
