<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <!--
      Renderer loads no remote code; CSP blocks anything that tries. That is the
      part that matters: script-src stays 'self', so nothing this window fetches
      can become code.

      connect-src and img-src cannot name hosts any more. The deployment is
      chosen at runtime on the login screen and is whatever the operator of that
      deployment says - an allowlist compiled into the app could only ever be
      wrong. What the window may *talk to* is therefore open; what it may *run*
      is not.

      None of this governs media. A peer connection is not a fetch and CSP has
      no say over it, which is as well: the addresses it reaches are the other
      participants', discovered at the time and nameable in advance by nobody.

      frame-src names YouTube and one loopback page for Listen Together. The
      loopback page is the player's origin: a `file://` document cannot frame a
      YouTube embed at all - the player refuses to configure itself, which is
      error 153 on every track - so a packaged build frames a page the main
      process serves on 127.0.0.1, and that page frames the embed. It is served
      on a port the OS picks behind a random path, which is why the directive
      cannot name a port. See electron/youtube-relay.ts.

      frame-src names YouTube, and only YouTube, for Listen Together. That is
      the one directive this feature needed and script-src is deliberately not
      it: the usual way to embed a player is to load YouTube's iframe_api.js,
      which is remote code running in *this* window. Instead the embed is driven
      over the postMessage protocol that script is a wrapper around, so YouTube's
      code runs in YouTube's own origin, in a sandboxed cross-origin frame that
      cannot read this document and which this document cannot read. See
      services/youtube.ts.

      script-src allows blob: for the microphone gate, which is an AudioWorklet
      compiled from a string - see services/mic-gate.ts. It has to be script-src
      and not worker-src: CSP puts worklets under script-src, and worker-src
      governs Worker/SharedWorker/ServiceWorker only. With blob: named on the
      wrong directive the gate's module was refused, so the gate never ran - no
      sensitivity, no push-to-talk silence, and no local speaking indicator,
      because the level the ring is drawn from is measured inside it.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' blob:; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://youtube-nocookie.com https://youtube.com http://127.0.0.1:*; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; media-src 'self' blob:; connect-src 'self' http: https: ws: wss:"
    />
    <title>BetweenUs</title>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
