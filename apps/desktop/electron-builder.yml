appId: com.betweenus.desktop
productName: BetweenUs
electronVersion: 40.10.6
# Chromium ships 55 locale tables; this application ships one language.
# `src/services/i18n.ts` names five locales, but that is a claim about which way
# the layout runs and what each language is called - no catalogue has been
# written, so every string on screen is the English at the call site. The other
# 54 .pak files are ~46 MB of translations for menus nobody is reading in
# Polish, carried into every download.
#
# The match is directional and it is worth knowing which way round: a file is
# kept when the *wanted* tag starts with the *file's* name, so asking for `en`
# against a folder holding `en-US.pak` matches nothing, deletes all 55, and
# leaves Chromium with no locale at all. The exact tag is not optional here.
#
# When a translation genuinely ships, its tag goes here beside this one.
electronLanguages:
  - en-US
# LZMA at its highest setting. The installer is built once per release by CI and
# then downloaded by everybody, so spending build minutes to take megabytes off
# the download is the right side of that trade every time.
compression: maximum
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
  - public/icon.png
# Release artifacts are named BetweenUs-<version>-<what it is>, the same shape
# the Android APKs use, so a downloaded file still says which release it is and
# a folder of them sorts by version rather than by target.
#
# One Windows target, and it is the installer. There was a portable exe beside
# it until the two of them turned every update into a question of which build
# somebody was running - and the answer was wrong often enough that neither
# updated reliably. See development/devdocs/UPDATES.md.
win:
  target:
    - nsis
  icon: public/icon.png
nsis:
  artifactName: BetweenUs-${version}-Setup.${ext}
  # Both places electron-builder starts the app go through StdUtils, which is
  # for de-elevating a launch this installer never needs to. See nsis/installer
  # .nsh and development/devdocs/UPDATES.md. Named explicitly rather than left
  # in the build resources: `build/` is gitignored, so a file there would exist
  # on one machine and never reach a release.
  include: nsis/installer.nsh
  # An assisted installer, not a one-click one: somebody installing BetweenUs
  # for the first time gets to say where it goes, and gets a licence-free
  # wizard they can read rather than a progress bar that has already finished.
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Per user, so no UAC prompt and no administrator to find. An update started
  # by the app itself runs as the user who is signed in, and a per-machine
  # install would ask that user for a password they may not have.
  perMachine: false
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: BetweenUs
  menuCategory: false
  runAfterFinish: true
  # The account's messages, keys and settings live in AppData. Uninstalling to
  # reinstall is a thing people do, and it must not be what loses their keys.
  deleteAppDataOnUninstall: false
  uninstallDisplayName: BetweenUs ${version}
mac:
  target: dmg
  icon: public/icon.png
  artifactName: BetweenUs-${version}.${ext}
# One Linux target, an AppImage, for the same reason Windows has one: it is the
# only format that can replace itself. The updater writes the new AppImage over
# the file `APPIMAGE` names (electron/updates.ts), which a .deb in /usr cannot
# have done to it without root. `scripts/install-linux.sh` puts it somewhere the
# user owns and adds the menu entry, icon and `betweenus` command around it.
linux:
  target: AppImage
  icon: public/icon.png
  artifactName: BetweenUs-${version}.${ext}
  category: Network
  # A plain lower-case binary rather than `@betweenus/desktop` sanitised.
  executableName: betweenus
  synopsis: Chat, voice, screen share and remote desktop
  # Electron reads `desktopName` from the packaged manifest and uses it as the
  # window's WM_CLASS / Wayland app_id, which is how a dock matches a running
  # window to its menu entry. Without it the window is an anonymous icon beside
  # the launcher it came from. Synced, the embedded entry's StartupWMClass says
  # the same thing, and the installer names its entry to match.
  syncDesktopName: true
# The static AppImage runtime rather than the legacy FUSE2 one, for two reasons
# measured on a real machine:
#
# - Start-up. `compression: maximum` above is right for the NSIS installer, but
#   the legacy toolset turns it into xz with 1 MB blocks, and an AppImage is not
#   unpacked once - it is read page by page through FUSE for as long as it runs.
#   A cold start took 90 seconds. The static runtime compresses with zstd, which
#   decompresses an order of magnitude faster.
# - Dependencies. The legacy runtime needs `libfuse.so.2`, which Ubuntu 22.04
#   and later no longer install; the static one carries its own FUSE3 client
#   and runs on a stock desktop.
toolsets:
  appimage: 1.0.3
# Written into the packaged package.json only. `name` stays `@betweenus/desktop`,
# which is what every installed client's userData directory is named after.
extraMetadata:
  desktopName: betweenus.desktop
