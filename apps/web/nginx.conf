# Serves the web client at the root of the gateway. Everything the app calls -
# /api and /ws - is matched by a more specific location in
# infrastructure/nginx/nginx.conf and never reaches this container.
server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        # A single-page app: unknown paths are its own routes, not 404s.
        try_files $uri $uri/ /index.html;
    }
}
