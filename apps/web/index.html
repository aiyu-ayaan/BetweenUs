<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      Same rule as the desktop renderer: script-src stays 'self', so nothing
      this page fetches can become code.

      connect-src is narrower than the desktop app's, and can be: a browser tab
      is served *by* the deployment it talks to, so 'self' covers the API and
      every WebSocket behind the same gateway. Pointing the page at a different
      deployment through the server picker is the one thing that needs more,
      hence the open http/ws entries - a browser would refuse the cross-origin
      fetch anyway unless that deployment allows it.

      None of this governs media. A peer connection is not a fetch and CSP has
      no say over it, which is as well: the addresses it reaches are the other
      participants', discovered at the time and nameable in advance by nobody.

      frame-src names YouTube, and only YouTube, for Listen Together. That is
      the one directive this feature needed and script-src is deliberately not
      it: the usual way to embed a player is to load YouTube's iframe_api.js,
      which is remote code running in *this* window. Instead the embed is driven
      over the postMessage protocol that script is a wrapper around, so YouTube's
      code runs in YouTube's own origin, in a sandboxed cross-origin frame that
      cannot read this document and which this document cannot read. See
      services/youtube.ts.

      script-src allows blob: for the microphone gate, which is an AudioWorklet
      compiled from a string - see services/mic-gate.ts. It has to be script-src
      and not worker-src: CSP puts worklets under script-src, and worker-src
      governs Worker/SharedWorker/ServiceWorker only. With blob: named on the
      wrong directive the gate's module was refused, so the gate never ran - no
      sensitivity, no push-to-talk silence, and no local speaking indicator,
      because the level the ring is drawn from is measured inside it.

      script-src also allows 'wasm-unsafe-eval' for WebAssembly compilation.
      script-src remains 'self' blob: - no external CDN code is permitted.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval'; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://youtube.com https://youtube-nocookie.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; media-src 'self' blob:; connect-src 'self' http: https: ws: wss:"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>BetweenUs</title>
  </head>
  <body class="h-full">
    <!--
      The first paint, before a single byte of the bundle has been parsed.

      `LoadingScreen` cannot cover this gap: it is React, and React is the thing
      being waited for. So the same mark is drawn here in plain markup with no
      script behind it, and `createRoot().render()` replaces it with the real
      component on mount - which is why this lives inside `#root` rather than
      beside it, and why nothing has to remove it.

      Hand-inlined on purpose. A stylesheet would be a second request in front
      of the paint this exists to bring forward - and so is an <img>, which is
      why the mark itself is inline too, written between the brand:mark markers
      by design/brand/build.py. The two colour values are
      the dark theme's `--color-ground` and `--color-accent` from `index.css`,
      which is the one duplication here worth having: a splash that reads the
      theme cannot draw until the theme has loaded.
    -->
    <div id="root" class="h-full">
      <style>
        /* The same layout as LoadingScreen, which replaces this on mount: the
           mark at the exact centre and the wordmark hung underneath, two equal
           halves either side, so the hand-over moves nothing. */
        #boot {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          background: rgb(6 7 10);
        }
        #boot .half {
          flex: 1;
        }
        #boot .below {
          padding-top: 1.25rem;
        }
        /* LoadingScreen's `text-sm font-semibold tracking-[0.35em]
           text-slate-300`, in Tailwind's own sans stack, so the line does not
           change face when React takes over. */
        #boot .word {
          margin: 0;
          font: 600 0.875rem/1.25rem ui-sans-serif, system-ui, sans-serif, 'Apple Color Emoji',
            'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji';
          letter-spacing: 0.35em;
          color: rgb(203 213 225);
          animation: boot-word 420ms cubic-bezier(0.2, 0.8, 0.2, 1) 520ms both;
        }
        @keyframes boot-word {
          from {
            transform: translateY(4px);
            opacity: 0;
          }
        }
        #boot .mark {
          width: 4.5rem;
          height: 4.5rem;
          fill: rgb(124 92 255);
          overflow: visible;
        }
        /* The bubble pops, the stem rises out of it, the tail flicks out, and
           then three typing dots play in the bowl for as long as this stays
           up. That motion is the whole progress indicator; there is no
           spinner. Pivots are viewBox units, the same as design/brand/build.py
           gives Android. */
        #boot .stem,
        #boot .tail,
        #boot .bowl {
          transform-box: view-box;
        }
        #boot .stem {
          transform-origin: 0 218px;
          animation: boot-stem 380ms cubic-bezier(0.2, 0.8, 0.2, 1) 130ms both;
        }
        #boot .tail {
          transform-origin: 92px 190px;
          animation: boot-tail 320ms cubic-bezier(0.2, 0.8, 0.2, 1) 340ms both;
        }
        #boot .bowl {
          transform-origin: 144px 148px;
          animation: boot-bowl 450ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }
        #boot circle {
          transform-box: fill-box;
          transform-origin: center;
          animation: boot-dot 1.2s ease-in-out 800ms infinite both;
        }
        #boot circle:nth-of-type(2) {
          animation-delay: 950ms;
        }
        #boot circle:nth-of-type(3) {
          animation-delay: 1100ms;
        }
        @keyframes boot-bowl {
          from {
            transform: scale(0.3);
            opacity: 0;
          }
          33% {
            opacity: 1;
          }
          64% {
            transform: scale(1.06);
          }
        }
        @keyframes boot-stem {
          from {
            transform: scaleY(0);
          }
        }
        @keyframes boot-tail {
          from {
            transform: scale(0);
          }
          60% {
            transform: scale(1.15);
          }
        }
        @keyframes boot-dot {
          0%,
          50%,
          100% {
            transform: translateY(0) scale(0.6);
            opacity: 0;
          }
          20% {
            transform: translateY(-6px) scale(1);
            opacity: 1;
          }
        }
        @media (prefers-reduced-motion: reduce) {
          #boot .word,
          #boot .mark * {
            animation: none;
          }
        }
      </style>
      <div id="boot">
        <div class="half"></div>
        <!-- brand:mark --><svg class="mark" viewBox="0 0 256 256" aria-hidden="true"><path class="stem" d="M54 42A19 19 0 0 1 92 42V218H54Z"/><path class="tail" d="M54 182L40.6 232L115.49 211.93L135.4 198.27L92 182Z"/><path class="bowl" d="M74 148A70 70 0 0 1 214 148A70 70 0 0 1 74 148ZM112 148A32 32 0 0 0 176 148A32 32 0 0 0 112 148Z"/><g class="dots"><circle cx="129" cy="148" r="6" opacity="0"/><circle cx="144" cy="148" r="6" opacity="0"/><circle cx="159" cy="148" r="6" opacity="0"/></g></svg><!-- /brand:mark -->
        <div class="half below"><p class="word">BETWEENUS</p></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
