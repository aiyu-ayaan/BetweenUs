worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    # Structured access log so gateway lines join service logs in one pipeline.
    log_format json escape=json
        '{"timestamp":"$time_iso8601","level":"info","service":"api-gateway",'
        '"requestId":"$http_x_request_id","method":"$request_method",'
        '"path":"$uri","status":$status,"durationMs":$request_time,'
        '"upstream":"$upstream_addr"}';
    access_log /dev/stdout json;
    error_log  /dev/stderr warn;

    # Docker's embedded DNS. Needed because every proxy_pass below goes through
    # a variable: a literal name (or an upstream block) is resolved once when
    # Nginx starts and cached for the life of the process, so the first time a
    # service container is recreated it gets a new IP and the gateway keeps
    # dialling the old one - every request 502s until Nginx itself restarts.
    # A variable makes the name resolve per request, honouring this TTL.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Routing only. No business logic lives in the gateway. Each location sets
    # its target as a variable just above its proxy_pass.
    #
    # There is no media route in this file and there must never be one. Calls
    # and remote sessions are set up over /ws/call and /ws/remote and then run
    # directly between the two clients; media that reached this gateway would
    # have to reach the tunnel in front of it, which does not carry UDP.

    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;
        client_max_body_size 10m;
        client_body_timeout 30s;

        # Secure headers. TLS termination happens at Cloudflare, in front of
        # this, so this listener speaks plain HTTP - but the header travels to
        # the browser through Cloudflare unchanged, and it is the browser that
        # has to be told never to try the plaintext scheme again.
        #
        # `add_header` in a location REPLACES this whole set rather than adding
        # to it, so any location that adds one of its own restates these too.
        # /api/v1/uploads below is the one that does.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # The web client asks for the microphone, the camera and the screen, so
        # those stay open to this origin. Nothing else here has any use for a
        # device, and a feature nobody uses is a feature worth refusing.
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=(), payment=(), usb=()" always;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $http_x_request_id;

        # Login and registration get the tighter bucket.
        location /api/v1/auth/ {
            limit_req zone=auth burst=10 nodelay;
            set $upstream auth-service:3001;
            proxy_pass http://$upstream;
        }

        # Admin API. Authorisation is the service's job; the gateway only
        # keeps the bucket tight, because this is a credentialed surface.
        location /api/v1/admin {
            limit_req zone=auth burst=20 nodelay;
            set $upstream auth-service:3001;
            proxy_pass http://$upstream;
        }

        # The admin panel itself: a static bundle in its own container.
        location /admin {
            limit_req zone=api burst=40 nodelay;
            set $upstream admin-web:80;
            proxy_pass http://$upstream;
        }

        location /api/v1/servers {
            limit_req zone=api burst=40 nodelay;
            set $upstream server-service:3003;
            proxy_pass http://$upstream;
        }

        location /api/v1/servers/ {
            limit_req zone=api burst=40 nodelay;
            set $upstream server-service:3003;
            proxy_pass http://$upstream;
        }

        location /api/v1/channels {
            limit_req zone=api burst=40 nodelay;
            set $upstream server-service:3003;
            proxy_pass http://$upstream;
        }

        location /api/v1/messages {
            limit_req zone=api burst=60 nodelay;
            set $upstream chat-service:3004;
            proxy_pass http://$upstream;
        }

        # Friends, user search and direct message channels. User-level data,
        # served by chat-service until user-service exists (development/TODO.md).
        location /api/v1/friends {
            limit_req zone=api burst=40 nodelay;
            set $upstream chat-service:3004;
            proxy_pass http://$upstream;
        }

        location /api/v1/users {
            limit_req zone=api burst=40 nodelay;
            set $upstream chat-service:3004;
            proxy_pass http://$upstream;
        }

        location /api/v1/dm {
            limit_req zone=api burst=40 nodelay;
            set $upstream chat-service:3004;
            proxy_pass http://$upstream;
        }

        # End-to-end encryption key directory. Public keys and sealed key
        # blobs only - the gateway and the service see no plaintext keys.
        location /api/v1/e2ee {
            limit_req zone=api burst=40 nodelay;
            set $upstream chat-service:3004;
            proxy_pass http://$upstream;
        }

        # ICE servers for a call. No token, no room, no media-server address -
        # there is no media server. Media goes directly between participants and
        # never passes through here, or through the tunnel in front of here.
        location /api/v1/calls {
            limit_req zone=api burst=20 nodelay;
            set $upstream call-service:3007;
            proxy_pass http://$upstream;
        }

        # Notification preferences and read state. No media, no fanout - the
        # message socket already delivers; this is the part that outlives a
        # client: mutes, quiet hours and how far each channel has been read.
        location /api/v1/notifications {
            limit_req zone=api burst=40 nodelay;
            set $upstream notification-service:3006;
            proxy_pass http://$upstream;
        }

        # Uploads and downloads. The cap here is per request body, which for a
        # large file is one part, not the whole file: the service assembles the
        # parts and enforces MAX_ATTACHMENT_BYTES on the result. Headroom over
        # MAX_UPLOAD_BYTES covers the multipart form framing around the part.
        location /api/v1/uploads {
            limit_req zone=api burst=20 nodelay;
            client_max_body_size 32m;
            set $upstream chat-service:3004;
            proxy_pass http://$upstream;
            proxy_request_buffering off;

            # Objects a user uploaded, served from the app's own origin. The
            # service already refuses anything but a raster image inline and
            # sends `nosniff`; this is the layer that says a page served from
            # here may load nothing and run nothing whatever it turns out to
            # be. `sandbox` drops it into an opaque origin with no scripts, so
            # even a document that somehow reached a browser reaches nothing
            # else.
            #
            # The inherited headers are restated because add_header here
            # replaces the server block's set rather than extending it.
            add_header Content-Security-Policy "default-src 'none'; sandbox" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy no-referrer always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }

        location /ws/chat {
            limit_conn conn 20;
            set $upstream chat-service:3004;
            proxy_pass http://$upstream;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # Long-lived sockets: do not let the gateway cut an idle connection.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /ws/presence {
            limit_conn conn 20;
            set $upstream presence-service:3005;
            proxy_pass http://$upstream;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Call signalling: the roster of who is in a call, and the offers,
        # answers and ICE candidates two peers exchange to reach each other.
        #
        # Everything here is small, text and reliable, which is exactly what a
        # Cloudflare Tunnel carries well. The media it arranges is large,
        # continuous UDP, which a tunnel carries not at all - and does not have
        # to, because it goes straight from one client to the other.
        location /ws/call {
            limit_conn conn 20;
            set $upstream call-service:3007;
            proxy_pass http://$upstream;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /api/v1/remote {
            limit_req zone=api burst=20 nodelay;
            set $upstream remote-gateway:3008;
            proxy_pass http://$upstream;
        }

        # The relay between a controller and an agent. The agent dialled out to
        # get here; nothing ever connects towards a machine, and 3389 is not
        # published anywhere in this stack.
        location /ws/remote {
            limit_conn conn 20;
            set $upstream remote-gateway:3008;
            proxy_pass http://$upstream;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # There was a /livekit location here, proxying an SFU's signalling
        # handshake. It is gone with the SFU, and so is the reason it was hard:
        # media had to reach the SFU on its own UDP ports, which no tunnel
        # carries, so the deployment needed a routable address that this proxy
        # could not provide. Peers now reach each other instead, and the only
        # thing the gateway carries for a call is /ws/call above.

        # The web client, at the root of the deployment: whatever no route above
        # claimed is one of its own pages. Nginx matches the longest prefix, so
        # this can never swallow /api, /ws or /admin.
        location / {
            limit_req zone=api burst=40 nodelay;
            set $upstream web:80;
            proxy_pass http://$upstream;
        }

        location /health {
            access_log off;
            return 200 '{"status":"ok","service":"api-gateway"}';
            add_header Content-Type application/json;
        }
    }
}
