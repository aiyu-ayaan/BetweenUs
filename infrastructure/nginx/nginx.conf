worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    # Structured access log so gateway lines join service logs in one pipeline.
    log_format json escape=json
        '{"timestamp":"$time_iso8601","level":"info","service":"api-gateway",'
        '"requestId":"$http_x_request_id","method":"$request_method",'
        '"path":"$uri","status":$status,"durationMs":$request_time,'
        '"upstream":"$upstream_addr"}';
    access_log /dev/stdout json;
    error_log  /dev/stderr warn;

    # Docker's embedded DNS. Needed because every proxy_pass below goes through
    # a variable: a literal name (or an upstream block) is resolved once when
    # Nginx starts and cached for the life of the process, so the first time a
    # service container is recreated it gets a new IP and the gateway keeps
    # dialling the old one - every request 502s until Nginx itself restarts.
    # A variable makes the name resolve per request, honouring this TTL.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Routing only. No business logic lives in the gateway. Each location sets
    # its target as a variable just above its proxy_pass; the WebRTC media path
    # is not among them - see /livekit.

    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;
        client_max_body_size 10m;
        client_body_timeout 30s;

        # Secure headers. TLS termination happens at Cloudflare, in front of this.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $http_x_request_id;

        # Login and registration get the tighter bucket.
        location /api/v1/auth/ {
            limit_req zone=auth burst=10 nodelay;
            set $upstream auth-service:3001;
            proxy_pass http://$upstream;
        }

        # Admin API. Authorisation is the service's job; the gateway only
        # keeps the bucket tight, because this is a credentialed surface.
        location /api/v1/admin {
            limit_req zone=auth burst=20 nodelay;
            set $upstream auth-service:3001;
            proxy_pass http://$upstream;
        }

        # The admin panel itself: a static bundle in its own container.
        location /admin {
            limit_req zone=api burst=40 nodelay;
            set $upstream admin-web:80;
            proxy_pass http://$upstream;
        }

        location /api/v1/servers {
            limit_req zone=api burst=40 nodelay;
            set $upstream server-service:3003;
            proxy_pass http://$upstream;
        }

        location /api/v1/servers/ {
            limit_req zone=api burst=40 nodelay;
            set $upstream server-service:3003;
            proxy_pass http://$upstream;
        }

        location /api/v1/channels {
            limit_req zone=api burst=40 nodelay;
            set $upstream server-service:3003;
            proxy_pass http://$upstream;
        }

        location /api/v1/messages {
            limit_req zone=api burst=60 nodelay;
            set $upstream chat-service:3004;
            proxy_pass http://$upstream;
        }

        # Friends, user search and direct message channels. User-level data,
        # served by chat-service until user-service exists (development/TODO.md).
        location /api/v1/friends {
            limit_req zone=api burst=40 nodelay;
            set $upstream chat-service:3004;
            proxy_pass http://$upstream;
        }

        location /api/v1/users {
            limit_req zone=api burst=40 nodelay;
            set $upstream chat-service:3004;
            proxy_pass http://$upstream;
        }

        location /api/v1/dm {
            limit_req zone=api burst=40 nodelay;
            set $upstream chat-service:3004;
            proxy_pass http://$upstream;
        }

        # End-to-end encryption key directory. Public keys and sealed key
        # blobs only - the gateway and the service see no plaintext keys.
        location /api/v1/e2ee {
            limit_req zone=api burst=40 nodelay;
            set $upstream chat-service:3004;
            proxy_pass http://$upstream;
        }

        # LiveKit access tokens. Media itself never passes through here; the
        # desktop client dials the SFU directly over WebRTC.
        location /api/v1/calls {
            limit_req zone=api burst=20 nodelay;
            set $upstream call-service:3007;
            proxy_pass http://$upstream;
        }

        # Notification preferences and read state. No media, no fanout - the
        # message socket already delivers; this is the part that outlives a
        # client: mutes, quiet hours and how far each channel has been read.
        location /api/v1/notifications {
            limit_req zone=api burst=40 nodelay;
            set $upstream notification-service:3006;
            proxy_pass http://$upstream;
        }

        # Uploads and downloads. The cap here is per request body, which for a
        # large file is one part, not the whole file: the service assembles the
        # parts and enforces MAX_ATTACHMENT_BYTES on the result. Headroom over
        # MAX_UPLOAD_BYTES covers the multipart form framing around the part.
        location /api/v1/uploads {
            limit_req zone=api burst=20 nodelay;
            client_max_body_size 32m;
            set $upstream chat-service:3004;
            proxy_pass http://$upstream;
            proxy_request_buffering off;
        }

        location /ws/chat {
            limit_conn conn 20;
            set $upstream chat-service:3004;
            proxy_pass http://$upstream;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # Long-lived sockets: do not let the gateway cut an idle connection.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /ws/presence {
            limit_conn conn 20;
            set $upstream presence-service:3005;
            proxy_pass http://$upstream;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /api/v1/remote {
            limit_req zone=api burst=20 nodelay;
            set $upstream remote-gateway:3008;
            proxy_pass http://$upstream;
        }

        # The relay between a controller and an agent. The agent dialled out to
        # get here; nothing ever connects towards a machine, and 3389 is not
        # published anywhere in this stack.
        location /ws/remote {
            limit_conn conn 20;
            set $upstream remote-gateway:3008;
            proxy_pass http://$upstream;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # LiveKit's signalling handshake, so a client needs one hostname for the
        # whole deployment: it starts with an HTTPS fetch of /rtc/validate and
        # continues as a WebSocket on /rtc. Media does NOT come through here -
        # WebRTC negotiates its own UDP path to the SFU (ports 7881 and the
        # 50000+ range), which is why this is cheap to proxy.
        #
        # A regex location with a named capture, and the whole upstream URI
        # spelled out - which is not a style choice. Every target in this file is
        # a variable so Nginx starts when a service is still coming up, and that
        # changes how proxy_pass treats the URI, in both directions:
        #
        #   proxy_pass http://$upstream/    a URI *after* a variable replaces the
        #                                   request URI outright rather than
        #                                   stripping the prefix, so every request
        #                                   arrived as a literal `/`
        #   proxy_pass http://$upstream     no URI after a variable passes the
        #                                   ORIGINAL request URI - rewrites above
        #                                   it are ignored, so `rewrite` cannot
        #                                   fix the first case either
        #
        # Both put `/livekit/rtc/v1` in front of LiveKit's root handler, which
        # answers `200 OK` in a millisecond. The Upgrade never happened and the
        # client said "could not establish signal connection: Encountered
        # websocket error during connection establishment".
        #
        # Building the URI from the capture is the form that works with a
        # variable target. `$is_args$args` is required with it: a spelled-out URI
        # does not carry the query string over, and the access token rides there.
        location ~ ^/livekit/(?<livekit_path>.*)$ {
            limit_conn conn 20;
            set $upstream livekit:7880;
            proxy_pass http://$upstream/$livekit_path$is_args$args;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # The web client, at the root of the deployment: whatever no route above
        # claimed is one of its own pages. Nginx matches the longest prefix, so
        # this can never swallow /api, /ws, /livekit or /admin.
        location / {
            limit_req zone=api burst=40 nodelay;
            set $upstream web:80;
            proxy_pass http://$upstream;
        }

        location /health {
            access_log off;
            return 200 '{"status":"ok","service":"api-gateway"}';
            add_header Content-Type application/json;
        }
    }
}
