# LiveKit SFU configuration.
#
# Everything except the API keys: those come from LIVEKIT_KEYS in the
# environment, in both compose files. Keeping a `keys:` block here as well gave
# a deployment two sources for one secret, and a stale container answering with
# the placeholder pair looks exactly like "token signature is invalid".
port: 7880

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50019
  # The server runs in a container while clients run on the host.
  use_external_ip: false

logging:
  level: info
  json: true

room:
  # Rooms are created implicitly by the first token holder to join and reaped
  # shortly after the last participant leaves.
  auto_create: true
  empty_timeout: 60
