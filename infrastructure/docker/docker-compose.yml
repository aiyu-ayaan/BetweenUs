# Full stack. Development uses docker-compose.dev.yml (data stores only) plus
# `pnpm dev` on the host; this file runs everything in containers.
#
#   docker compose -f infrastructure/docker/docker-compose.yml up -d --build
#
# Networks are segmented so only the services that need a data store can reach
# it. Postgres and Redis publish no ports.

name: nexora

x-service-env: &service-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-nexora}?schema=public
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
  # Seals OAuth client secrets at rest; falls back to JWT_SECRET when unset.
  SETTINGS_SECRET: ${SETTINGS_SECRET:-}
  # Where a browser reaches this deployment - the OAuth callback is built from it.
  PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
  OAUTH_ALLOWED_REDIRECTS: ${OAUTH_ALLOWED_REDIRECTS:-}
  CORS_ORIGIN: ${CORS_ORIGIN:-*}
  # Empty S3 values keep uploads on the local volume mounted below.
  STORAGE_DRIVER: ${STORAGE_DRIVER:-}
  LOCAL_STORAGE_PATH: /data/uploads
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
  MAX_ATTACHMENT_BYTES: ${MAX_ATTACHMENT_BYTES:-104857600}
  MAX_PICTURE_BYTES: ${MAX_PICTURE_BYTES:-8388608}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}
  S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      # Published on the host so a cloudflared already running there - one
      # tunnel for the whole server - can point at http://localhost:8080. With
      # the container tunnel below this does not need to be published at all;
      # set GATEWAY_PORT to 127.0.0.1:8080 to keep it off the LAN.
      - "${GATEWAY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - server-service
      - chat-service
      - call-service
      - presence-service
      - notification-service
      - remote-gateway
      - admin-web
    networks:
      - cloudflare-network
      - api-network
      # LiveKit's signalling handshake is proxied under /livekit, so a client
      # needs one hostname for the whole deployment. Media stays on its own path.
      - media-network
      - remote-network

  # The admin panel: static bundle behind the same gateway.
  admin-web:
    build:
      context: ../..
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    networks:
      - api-network

  # Public ingress, opt-in:
  #   docker compose -f infrastructure/docker/docker-compose.yml --profile public up -d
  #
  # Skip it entirely if cloudflared already runs on the host for the whole
  # server: add one ingress entry pointing at http://localhost:${GATEWAY_PORT}
  # and reload it. See infrastructure/cloudflare/tunnel.yml, which documents
  # both ways round.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - cloudflare-network
    profiles:
      - public

  # One-shot: applies Prisma migrations before any service accepts traffic.
  # Reuses the auth-service image because it already carries the schema and the
  # Prisma CLI; nothing about it is auth-specific.
  migrate:
    build:
      context: ../..
      dockerfile: apps/services/auth-service/Dockerfile
    restart: "no"
    # Prisma verifies it can write to its engine directory; the image's `node`
    # user cannot. Nothing else runs as root.
    user: root
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-nexora}?schema=public
    working_dir: /repo/packages/database
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data-network

  auth-service:
    build:
      context: ../..
      dockerfile: apps/services/auth-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: *service-env
      AUTH_SERVICE_PORT: 3001
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - api-network
      - data-network

  server-service:
    build:
      context: ../..
      dockerfile: apps/services/server-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: *service-env
      SERVER_SERVICE_PORT: 3003
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - api-network
      - data-network

  chat-service:
    build:
      context: ../..
      dockerfile: apps/services/chat-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: *service-env
      CHAT_SERVICE_PORT: 3004
    volumes:
      # Uploads survive container replacement when the local driver is active.
      # UPLOAD_DATA_PATH takes either a Docker volume name (the default) or a
      # host path - `/mnt/disk2/nexora-uploads`, `D:/nexora-uploads` - to keep
      # the files somewhere you can see and back up.
      - ${UPLOAD_DATA_PATH:-upload-data}:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - api-network
      - data-network

  notification-service:
    build:
      context: ../..
      dockerfile: apps/services/notification-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: *service-env
      NOTIFICATION_SERVICE_PORT: 3006
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - api-network
      - data-network

  presence-service:
    build:
      context: ../..
      dockerfile: apps/services/presence-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: *service-env
      PRESENCE_SERVICE_PORT: 3005
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - api-network
      - data-network

  call-service:
    build:
      context: ../..
      dockerfile: apps/services/call-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: *service-env
      CALL_SERVICE_PORT: 3007
      # Handed to clients, so never a container hostname. Defaults to the path
      # Nginx proxies to the SFU, which keeps the deployment on one public
      # address; set LIVEKIT_URL to an absolute wss:// URL to split it out.
      LIVEKIT_URL: ${LIVEKIT_URL:-/livekit}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - api-network
      - data-network

  # Remote desktop, kept off every network it does not need. It talks to
  # Postgres and to LiveKit (to mint session tokens); it never reaches the chat
  # or media services, and nothing reaches the machines - their agents dial out.
  remote-gateway:
    build:
      context: ../..
      dockerfile: apps/services/remote-gateway/Dockerfile
    restart: unless-stopped
    environment:
      <<: *service-env
      REMOTE_GATEWAY_PORT: 3008
      LIVEKIT_URL: ${LIVEKIT_URL:-/livekit}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - remote-network
      - data-network

  livekit:
    # Keep in step with the livekit-client version in apps/desktop - see the
    # note in docker-compose.dev.yml.
    image: livekit/livekit-server:v1.13.5
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      # Overrides the key pair in the mounted config file.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}"
    volumes:
      - ../livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      # Media ingress is its own path: WebRTC never goes through Nginx.
      - "7880:7880"
      - "7881:7881"
      # Must match rtc.port_range_* in ../livekit/livekit.yaml.
      - "50000-50019:50000-50019/udp"
    networks:
      - media-network

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-nexora}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - data-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - data-network

volumes:
  postgres-data:
  redis-data:
  upload-data:

networks:
  cloudflare-network:
  api-network:
  data-network:
  media-network:
  # Remote desktop is deliberately not on api-network: the gateway reaches
  # Postgres and nothing else reaches it except Nginx.
  remote-network:
