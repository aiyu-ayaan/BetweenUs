# Full stack. Development uses docker-compose.dev.yml (data stores only) plus
# `pnpm dev` on the host; this file runs everything in containers.
#
#   docker compose -f infrastructure/docker/docker-compose.yml up -d --build
#
# Networks are segmented so only the services that need a data store can reach
# it. Postgres and Redis publish no ports.

name: nexora

x-service-env: &service-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-nexora}?schema=public
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
  CORS_ORIGIN: ${CORS_ORIGIN:-*}
  # Empty S3 values keep uploads on the local volume mounted below.
  STORAGE_DRIVER: ${STORAGE_DRIVER:-}
  LOCAL_STORAGE_PATH: /data/uploads
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}
  S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - workspace-service
      - chat-service
      - call-service
      - presence-service
    networks:
      - cloudflare-network
      - api-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
    depends_on:
      - nginx
    networks:
      - cloudflare-network
    profiles:
      # Public ingress is opt-in: docker compose --profile public up
      - public

  # One-shot: applies Prisma migrations before any service accepts traffic.
  # Reuses the auth-service image because it already carries the schema and the
  # Prisma CLI; nothing about it is auth-specific.
  migrate:
    build:
      context: ../..
      dockerfile: apps/services/auth-service/Dockerfile
    restart: "no"
    # Prisma verifies it can write to its engine directory; the image's `node`
    # user cannot. Nothing else runs as root.
    user: root
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-nexora}?schema=public
    working_dir: /repo/packages/database
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data-network

  auth-service:
    build:
      context: ../..
      dockerfile: apps/services/auth-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: *service-env
      AUTH_SERVICE_PORT: 3001
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - api-network
      - data-network

  workspace-service:
    build:
      context: ../..
      dockerfile: apps/services/workspace-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: *service-env
      WORKSPACE_SERVICE_PORT: 3003
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - api-network
      - data-network

  chat-service:
    build:
      context: ../..
      dockerfile: apps/services/chat-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: *service-env
      CHAT_SERVICE_PORT: 3004
    volumes:
      # Uploads survive container replacement when the local driver is active.
      - upload-data:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - api-network
      - data-network

  presence-service:
    build:
      context: ../..
      dockerfile: apps/services/presence-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: *service-env
      PRESENCE_SERVICE_PORT: 3005
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - api-network
      - data-network

  call-service:
    build:
      context: ../..
      dockerfile: apps/services/call-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: *service-env
      CALL_SERVICE_PORT: 3007
      # Clients dial LiveKit directly, so this is the public URL, not a
      # container hostname.
      LIVEKIT_URL: ${LIVEKIT_URL:?LIVEKIT_URL is required}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - api-network
      - data-network

  livekit:
    # Keep in step with the livekit-client version in apps/desktop - see the
    # note in docker-compose.dev.yml.
    image: livekit/livekit-server:v1.13.5
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      # Overrides the key pair in the mounted config file.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}"
    volumes:
      - ../livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      # Media ingress is its own path: WebRTC never goes through Nginx.
      - "7880:7880"
      - "7881:7881"
      # Must match rtc.port_range_* in ../livekit/livekit.yaml.
      - "50000-50019:50000-50019/udp"
    networks:
      - media-network

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-nexora}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - data-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - data-network

volumes:
  postgres-data:
  redis-data:
  upload-data:

networks:
  cloudflare-network:
  api-network:
  data-network:
  # Reserved for phases 10-11; declared so service placement stays explicit.
  media-network:
  remote-network:
