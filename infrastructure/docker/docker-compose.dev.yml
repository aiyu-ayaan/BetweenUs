# Development-only infrastructure.
# Runs the stateful dependencies so developers do not install Postgres/Redis locally.
# Application services run on the host with `pnpm dev`.
#
# Usage:
#   pnpm dev:infra        (docker compose --env-file .env -f ... up -d)
#   pnpm dev:infra:down
#
# The `--env-file .env` matters: compose reads `.env` from *this* directory, not
# from the repo root, so without it every `${VAR}` below comes up empty. The
# LiveKit keys are declared required for that reason - a default would let the
# SFU start with a placeholder secret while host-run call-service signs with the
# real one from `.env`, and every join would fail with "token signature is
# invalid".

name: nexora-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexora-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-nexora}
    ports:
      # Exposed on localhost only - never bind 0.0.0.0 for a database.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nexora}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: nexora-dev-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Voice/video/screen-share SFU. Media goes desktop -> LiveKit directly and is
  # end-to-end encrypted, so the server relays frames it cannot decrypt.
  livekit:
    # Must stay in step with the livekit-client version in apps/desktop: the
    # client tags every publisher offer with an id and waits for the answer to
    # echo it. Servers older than v1.9 drop the field, so every publish (mic,
    # camera, screen share) fails with "negotiation timed out".
    image: livekit/livekit-server:v1.13.5
    container_name: nexora-dev-livekit
    restart: unless-stopped
    # The address the SFU puts in its ICE candidates. Left alone it advertises
    # the address it sees on itself - a bridge address like 172.24.0.4 - and
    # clients in development are not on that network: Docker Desktop and WSL2
    # do not route the host to it. Signalling still succeeds, because that goes
    # through the published port, so a join gets all the way to negotiating
    # media and then sits there until it times out.
    #
    # Everything below is published on the host, so 127.0.0.1 is the address
    # that actually works here. NEXORA_LIVEKIT_NODE_IP overrides it for the one
    # case that needs another answer: joining this dev SFU from a second machine
    # on the LAN, which wants this host's address instead.
    command:
      - "--config"
      - "/etc/livekit.yaml"
      - "--node-ip"
      - "${NEXORA_LIVEKIT_NODE_IP:-127.0.0.1}"
    environment:
      # The only place keys are set - the config file carries none. Required,
      # not defaulted: a default is what silently drifts from `.env`.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required - run via pnpm dev:infra so .env is passed}: '${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required - run via pnpm dev:infra so .env is passed}'"
    volumes:
      - ../livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      # ICE/UDP media. Kept to 20 ports: enough for small test calls and fast to
      # publish on Docker Desktop.
      - "50000-50019:50000-50019/udp"

volumes:
  postgres-data:
  redis-data:
