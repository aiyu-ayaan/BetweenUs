# Development-only infrastructure.
# Runs the stateful dependencies so developers do not install Postgres/Redis locally.
# Application services run on the host with `pnpm dev`.
#
# Usage:
#   docker compose -f infrastructure/docker/docker-compose.dev.yml up -d
#   docker compose -f infrastructure/docker/docker-compose.dev.yml down

name: nexora-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexora-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-nexora}
    ports:
      # Exposed on localhost only - never bind 0.0.0.0 for a database.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nexora}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: nexora-dev-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
