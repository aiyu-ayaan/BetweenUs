# Development-only infrastructure.
# Runs the stateful dependencies so developers do not install Postgres/Redis locally.
# Application services run on the host with `pnpm dev`.
#
# Usage:
#   docker compose -f infrastructure/docker/docker-compose.dev.yml up -d
#   docker compose -f infrastructure/docker/docker-compose.dev.yml down

name: nexora-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexora-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-nexora}
    ports:
      # Exposed on localhost only - never bind 0.0.0.0 for a database.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nexora}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: nexora-dev-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Voice/video/screen-share SFU. Media goes desktop -> LiveKit directly and is
  # end-to-end encrypted, so the server relays frames it cannot decrypt.
  livekit:
    # Must stay in step with the livekit-client version in apps/desktop: the
    # client tags every publisher offer with an id and waits for the answer to
    # echo it. Servers older than v1.9 drop the field, so every publish (mic,
    # camera, screen share) fails with "negotiation timed out".
    image: livekit/livekit-server:v1.13.5
    container_name: nexora-dev-livekit
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      # Same pair as .env.example, and the only place keys are set - the config
      # file carries none, so the SFU and call-service cannot drift apart.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: '${LIVEKIT_API_SECRET:-nexora-dev-livekit-secret-change-me-please}'"
    volumes:
      - ../livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      # ICE/UDP media. Kept to 20 ports: enough for small test calls and fast to
      # publish on Docker Desktop.
      - "50000-50019:50000-50019/udp"

volumes:
  postgres-data:
  redis-data:
